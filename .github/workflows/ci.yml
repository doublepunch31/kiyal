name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test on CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags, with no floating major tag.
      # Python 3.12 comes from .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Reference tests download model weights. The key hashes the file that pins
      # the model repos and revisions, so a new pin starts a fresh cache.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-${{ hashFiles('tests/reference/conftest.py') }}

      - name: Install dependencies
        run: uv sync --locked --extra cpu

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type-check
        run: uv run pyright

      - name: Test
        run: uv run pytest -m "not slow"

      - name: Test against reference weights
        run: uv run pytest -m slow
