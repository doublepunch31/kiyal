[project]
name = "kiyal"
version = "0.1.0.dev0"
description = "LLM inference engine and OpenAI-compatible server, built from scratch in PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
]

# torch is installed through an extra so each machine picks its build:
# `uv sync --extra cpu` for CPU and Apple Silicon.
[project.optional-dependencies]
cpu = ["torch>=2.15,<3"]

[project.scripts]
kiyal = "kiyal.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

# The CPU-only build skips the CUDA libraries that the default Linux
# wheel on PyPI pulls in. Its macOS wheel is the same MPS-enabled build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]

[tool.ruff.lint.per-file-ignores]
# Assertions compare against literal expected values by design.
"tests/**" = ["PLR2004"]

[tool.pytest]
testpaths = ["tests"]
strict = true
# importlib mode lets test files in different directories share a name
# without __init__.py files.
addopts = ["-ra", "--import-mode=importlib"]
markers = ["slow: downloads real model weights; deselect with -m 'not slow'"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "transformers>=5.22.2",
]
