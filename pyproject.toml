[project]
name = "kiyal"
version = "0.1.0.dev0"
description = "LLM inference engine and OpenAI-compatible server, built from scratch in PyTorch."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.24,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]

[tool.ruff.lint.per-file-ignores]
# Assertions compare against literal expected values by design.
"tests/**" = ["PLR2004"]

[tool.pytest]
testpaths = ["tests"]
strict = true
# importlib mode lets test files in different directories share a name
# without __init__.py files.
addopts = ["-ra", "--import-mode=importlib"]
markers = ["slow: downloads real model weights; deselect with -m 'not slow'"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
